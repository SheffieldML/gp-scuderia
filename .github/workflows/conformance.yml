name: conformance
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly canary against the latest releases
  workflow_dispatch:
env:
  GPC_REF: cip0016-interchange-adapter   # GPc branch that carries CInterchange
jobs:
  oracle:
    # Schema validation and the checks that need only the pinned GPy oracle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r ci/pinned-gpy.txt
      - run: python scripts/record_check.py results/validate.json validate "Goldens satisfy the JSON schema" -- python scripts/validate.py
      - run: python scripts/record_check.py results/conformance_gpy.json gpy-roundtrip "GPy export/import round trip" -- python scripts/conformance_gpy.py
      - run: python scripts/record_check.py results/laplace_independent.json laplace-independent "Laplace goldens against an independent numpy implementation" -- python scripts/check_laplace_independent.py
      - run: python scripts/record_check.py results/framework_files.json framework-files "Framework files valid; derived expectations match the snapshot in both directions" -- python scripts/check_framework_files.py
      - run: python scripts/record_check.py results/runner_contract.json runner-contract "Runner contract - schemas, crash isolation, per-task errors" -- python scripts/check_runner_contract.py
      - run: python scripts/record_check.py results/descriptors.json descriptors "Task descriptors match hand-computed values" -- python scripts/check_descriptors.py
      - run: python scripts/record_check.py results/sparse_checks.json sparse-checks "Sparse property checks can fail - broken DTCVar is caught" -- python scripts/check_sparse_properties.py
      - run: python scripts/record_check.py results/timing_checks.json timing-checks "Timing machinery - grid and tier expansion, in-runner statistics, schemas" -- python scripts/check_timing.py
      - run: python scripts/record_check.py results/gradient_checks.json gradient-checks "Gradient machinery - oracle against finite differences, wrong chain rule rejected, contract v1 and v2 schemas" -- python scripts/check_gradient.py
      - run: python scripts/compare.py gpy --mode pinned --json results/gpy-pinned.json
      - run: python scripts/benchmarks.py generate --out bench-data --tier pr
      - run: python scripts/benchmarks.py run gpy --data bench-data --mode pinned --json results/bench-gpy-pinned.json
      - uses: actions/upload-artifact@v4
        with: {name: bench-data, path: bench-data}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: results-oracle, path: results}

  matrix:
    # The job matrix comes from frameworks/*.yaml (CIP-0003). Latest-version entries are added on
    # scheduled and manual runs only.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml
      - id: m
        run: python scripts/ci_matrix.py ${{ (github.event_name != 'push' && github.event_name != 'pull_request') && '--latest' || '' }} --github-output

  frameworks:
    # Each framework is installed fresh and run live against every golden.
    needs: [matrix, oracle]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.mode == 'latest' }}   # upstream drift is news, not a broken build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - if: matrix.kind == 'python'
        run: pip install -r ${{ matrix.install }}
      - if: matrix.kind == 'r'
        uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - if: matrix.kind == 'r'
        run: |
          pip install numpy pyyaml jsonschema
          # CRAN has no binaries for this runner image, so packages build from source
          sudo apt-get update && sudo apt-get install -y libuv1-dev libnlopt-dev cmake
          mkdir -p "$HOME/rlib"
          echo "R_LIBS_USER=$HOME/rlib" >> "$GITHUB_ENV"
          R_LIBS_USER="$HOME/rlib" Rscript R/install.R ${{ matrix.install }}
      - if: matrix.kind == 'octave'
        run: |
          pip install numpy pyyaml jsonschema
          sudo apt-get update && sudo apt-get install -y octave
          python scripts/ci_fetch.py ${{ matrix.framework }} fetched
      - run: python scripts/compare.py ${{ matrix.framework }} --mode ${{ matrix.mode }} --json results/${{ matrix.framework }}-${{ matrix.mode }}.json
      - if: matrix.unsupported_check && matrix.kind == 'r'
        run: python scripts/record_check.py results/unsupported-${{ matrix.framework }}-${{ matrix.mode }}.json unsupported-${{ matrix.framework }} "outside the exact Gaussian slice is refused, not substituted" -- python scripts/check_r_refusals.py ${{ matrix.framework }}
      - if: matrix.unsupported_check && matrix.kind == 'python'
        run: python scripts/record_check.py results/unsupported-${{ matrix.framework }}-${{ matrix.mode }}.json unsupported-${{ matrix.framework }} "dtc and pitc are refused, not substituted" -- python scripts/check_unsupported_approximations.py ${{ matrix.framework }}
      - uses: actions/download-artifact@v4
        with: {name: bench-data, path: bench-data}
      - run: python scripts/benchmarks.py run ${{ matrix.framework }} --data bench-data --mode ${{ matrix.mode }} --json results/bench-${{ matrix.framework }}-${{ matrix.mode }}.json
      - name: Timing, pr tier (informational, hosted runners are noisy and timing never gates)
        continue-on-error: true
        run: |
          python scripts/benchmarks.py time ${{ matrix.framework }} --data bench-data --tier pr --threads 1 --json results/time-${{ matrix.framework }}-${{ matrix.mode }}-1.json
          python scripts/benchmarks.py time ${{ matrix.framework }} --data bench-data --tier pr --threads all --json results/time-${{ matrix.framework }}-${{ matrix.mode }}-all.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "results-${{ matrix.framework }}-${{ matrix.mode }}", path: results}

  gpc:
    # GPc C++ reader and CLI, plus the GPc Python package, against the goldens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: SheffieldML/GPc, ref: "${{ env.GPC_REF }}", path: gpc}
      - run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev liblapack-dev
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r ci/pinned-gpy.txt
      - run: cp gpc/make.linux gpc/make.inc
      - run: cd gpc && make testInterchange gp
      - id: pyinstall
        run: pip install ./gpc/python
        continue-on-error: true
      - name: Conformance (CLI always; Python package when it installed)
        run: |
          if [ "${{ steps.pyinstall.outcome }}" = success ]; then
            export GPC_PY=$(python -c "import site;print(site.getsitepackages()[0])")
          else
            export GPC_PY=/nonexistent
          fi
          GPC_ROOT=$PWD/gpc PYTHON=python python scripts/record_check.py results/gpc-cli.json gpc-cli "GPc C++ reader, CLI and Laplace round trip" -- sh scripts/conformance.sh
      - run: python scripts/compare.py gpc --mode pinned --json results/gpc-pinned.json
        if: steps.pyinstall.outcome == 'success'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: results-gpc, path: results}

  report:
    needs: [oracle, frameworks, gpc]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {path: all-results, pattern: "results-*", merge-multiple: true}
      - run: pip install pyyaml
      - run: python scripts/report.py all-results --out report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: conformance-report, path: report}
