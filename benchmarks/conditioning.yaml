name: conditioning
kind: accuracy
description: >
  Ill-conditioned kernel matrices: tiny noise, and inputs clustered so tightly that the
  matrix is numerically low rank. Frameworks differ in jitter and in how they factorise,
  so this is where silent disagreement shows first.
seed: 1
base:
  n: 100
  input_dim: 1
  noise: 0.1
  approximation: ftc
  kernel: {type: kern.rbf, variance: 1.0, lengthscale: 1.0}
cases:
  - {id: noise_1e-2, noise: 1.0e-2}
  - {id: noise_1e-4, noise: 1.0e-4}
  - {id: clustered,  x: clustered, noise: 1.0e-2}
  - {id: duplicated, x: duplicated, noise: 1.0e-3}
tolerance: {log_likelihood: 1.0e-4, mean: 1.0e-4, var: 1.0e-4}
known:
  gpflow: {noise_1e-4: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; suspected GPy Cholesky jitter, not yet confirmed", duplicated: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; GPy is the outlier, mechanism unconfirmed"}
  gpytorch: {noise_1e-4: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; suspected GPy Cholesky jitter, not yet confirmed", duplicated: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; GPy is the outlier, mechanism unconfirmed"}
  gpjax: {noise_1e-4: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; suspected GPy Cholesky jitter, not yet confirmed", duplicated: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; GPy is the outlier, mechanism unconfirmed"}
  gpml: {noise_1e-4: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; suspected GPy Cholesky jitter, not yet confirmed", duplicated: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; GPy is the outlier, mechanism unconfirmed"}
  gpmat: {noise_1e-4: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; suspected GPy Cholesky jitter, not yet confirmed", duplicated: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; GPy is the outlier, mechanism unconfirmed"}
