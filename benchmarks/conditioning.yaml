name: conditioning
kind: accuracy
description: >
  Ill-conditioned kernel matrices: tiny noise, and inputs clustered so tightly that the
  matrix is numerically low rank. Frameworks differ in jitter and in how they factorise,
  so this is where silent disagreement shows first.
seed: 1
base:
  n: 100
  input_dim: 1
  noise: 0.1
  approximation: ftc
  kernel: {type: kern.rbf, variance: 1.0, lengthscale: 1.0}
cases:
  - {id: noise_1e-2, noise: 1.0e-2}
  - {id: noise_1e-4, noise: 1.0e-4}
  - {id: clustered,  x: clustered, noise: 1.0e-2}
  - {id: duplicated, x: duplicated, noise: 1.0e-3}
tolerance: {log_likelihood: 1.0e-4, mean: 1.0e-4, var: 1.0e-4}
known:
  gpflow: {noise_1e-4: {why: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; GPy adds 1e-8 to the noise variance in exact Gaussian inference (confirmed for the gradient in gradient_agreement small_noise; the same mechanism accounts for the log likelihood gap at this noise level, which is 1e-4 relative in the variance)", fixed_by: exact_jitter}, duplicated: {why: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; confirmed to be the 1e-8 added to the noise variance, since the gap closes when GPy exact inference runs with jitter=0", fixed_by: exact_jitter}}
  gpytorch: {noise_1e-4: {why: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; GPy adds 1e-8 to the noise variance in exact Gaussian inference (confirmed for the gradient in gradient_agreement small_noise; the same mechanism accounts for the log likelihood gap at this noise level, which is 1e-4 relative in the variance)", fixed_by: exact_jitter}, duplicated: {why: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; confirmed to be the 1e-8 added to the noise variance, since the gap closes when GPy exact inference runs with jitter=0", fixed_by: exact_jitter}}
  gpjax: {noise_1e-4: {why: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; GPy adds 1e-8 to the noise variance in exact Gaussian inference (confirmed for the gradient in gradient_agreement small_noise; the same mechanism accounts for the log likelihood gap at this noise level, which is 1e-4 relative in the variance)", fixed_by: exact_jitter}, duplicated: {why: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; confirmed to be the 1e-8 added to the noise variance, since the gap closes when GPy exact inference runs with jitter=0", fixed_by: exact_jitter}}
  gpml: {noise_1e-4: {why: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; GPy adds 1e-8 to the noise variance in exact Gaussian inference (confirmed for the gradient in gradient_agreement small_noise; the same mechanism accounts for the log likelihood gap at this noise level, which is 1e-4 relative in the variance)", fixed_by: exact_jitter}, duplicated: {why: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; confirmed to be the 1e-8 added to the noise variance, since the gap closes when GPy exact inference runs with jitter=0", fixed_by: exact_jitter}}
  gpmat: {noise_1e-4: {why: "the five non-GPy frameworks agree with each other and differ from the GPy reference by about 0.4 in log likelihood; GPy adds 1e-8 to the noise variance in exact Gaussian inference (confirmed for the gradient in gradient_agreement small_noise; the same mechanism accounts for the log likelihood gap at this noise level, which is 1e-4 relative in the variance)", fixed_by: exact_jitter}, duplicated: {why: "duplicated inputs, noise 1e-3: the five non-GPy frameworks agree with an independent numpy Cholesky to 1e-9 and GPy differs by 3.5e-3; confirmed to be the 1e-8 added to the noise variance, since the gap closes when GPy exact inference runs with jitter=0", fixed_by: exact_jitter}}
  kergp: {noise_1e-4: {why: "duplicated inputs and small noise: the package and an independent numpy Cholesky agree to 1e-9 in the log likelihood; the GPy reference adds 1e-8 to the noise variance in exact Gaussian inference (see gradient_agreement small_noise) and so differs: by 0.4 at noise 1e-4 and 3.5e-3 at noise 1e-3. A property of the oracle, not of this framework", fixed_by: exact_jitter}, duplicated: {why: "duplicated inputs and small noise: the package and an independent numpy Cholesky agree to 1e-9 in the log likelihood; the GPy reference adds 1e-8 to the noise variance in exact Gaussian inference (see gradient_agreement small_noise) and so differs: by 0.4 at noise 1e-4 and 3.5e-3 at noise 1e-3. A property of the oracle, not of this framework", fixed_by: exact_jitter}}
