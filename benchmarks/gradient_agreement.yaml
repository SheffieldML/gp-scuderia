  gpml: {small_noise: {why: 'GPy adds 1e-8 to the noise variance in exact Gaussian inference (exact_gaussian_inference.py: variance+1e-8), so at noise 1e-3 it evaluates at a variance 1e-5 relative higher than the document states. Against a 60-digit evaluation, the other five frameworks agree to 1e-12 and GPy agrees to 1e-12 only when that 1e-8 is added to the noise. The deviation is a property of the GPy oracle, not of this framework', fixed_by: exact_jitter}}
  gpmat: {dtcvar_16: {why: 'Kuu jitter: GPy uses 1e-8, this framework 1e-6; the same convention difference as in sparse_properties, here seen at about 2e-5 relative in the gradient', fixed_by: kuu_jitter}, small_noise: {why: 'GPy adds 1e-8 to the noise variance in exact Gaussian inference (exact_gaussian_inference.py: variance+1e-8), so at noise 1e-3 it evaluates at a variance 1e-5 relative higher than the document states. Against a 60-digit evaluation, the other five frameworks agree to 1e-12 and GPy agrees to 1e-12 only when that 1e-8 is added to the noise. The deviation is a property of the GPy oracle, not of this framework', fixed_by: exact_jitter}}
