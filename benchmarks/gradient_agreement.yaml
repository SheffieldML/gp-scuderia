name: gradient_agreement
kind: gradient
description: >
  Gradient of the log likelihood with respect to every kernel and noise hyperparameter, in the
  wire's natural (positive, untransformed) parameterisation. The oracle is GPy's analytic
  gradient, which the generator cross-checks against central differences of GPy's own log
  likelihood and refuses to emit if they disagree. A framework that optimises in a log or raw
  space must apply the chain rule; dropping that factor fails every case. Scope: kernel
  variance and lengthscale, plus Gaussian noise variance, for ftc and the sparse
  approximations. Inducing inputs, means and normalisers are outside it.
seed: 5
base:
  n: 60
  input_dim: 2
  noise: 0.1
  approximation: ftc
  kernel: {type: kern.rbf, variance: 1.0, lengthscale: 1.0}
cases:
  - {id: rbf}
  - {id: matern32, kernel: {type: kern.matern32, variance: 1.0, lengthscale: 1.0}}
  - {id: matern52, kernel: {type: kern.matern52, variance: 1.0, lengthscale: 1.0}}
  - {id: rbf_ard, kernel: {type: kern.rbf, variance: 1.5, lengthscale: [0.7, 1.6], ARD: true}}
  - id: rbf_plus_white
    kernel: {type: kern.add, parts: [{type: kern.rbf, variance: 1.0, lengthscale: 1.0}, {type: kern.white, variance: 0.1}]}
  - id: rbf_plus_bias
    kernel: {type: kern.add, parts: [{type: kern.rbf, variance: 1.0, lengthscale: 1.0}, {type: kern.bias, variance: 0.5}]}
  - id: rbf_plus_linear
    kernel: {type: kern.add, parts: [{type: kern.rbf, variance: 1.0, lengthscale: 1.0}, {type: kern.linear, variance: 0.3}]}
  - id: rbf_times_matern52
    kernel: {type: kern.prod, parts: [{type: kern.rbf, variance: 1.0, lengthscale: 1.0}, {type: kern.matern52, variance: 1.2, lengthscale: 0.8}]}
  - {id: short_lengthscale, kernel: {type: kern.rbf, variance: 1.0, lengthscale: 0.05}}
  - {id: long_lengthscale, kernel: {type: kern.rbf, variance: 1.0, lengthscale: 20.0}}
  - {id: large_variance, kernel: {type: kern.rbf, variance: 100.0, lengthscale: 1.0}}
  - {id: small_noise, noise: 1.0e-3}
  - {id: dtcvar_16, approximation: dtcvar, inducing: 16}
  - {id: fitc_16, approximation: fitc, inducing: 16}
tolerance:
  log_likelihood: 1.0e-4
  mean: 1.0e-4
  var: 1.0e-4
  gradient: {rtol: 1.0e-5, atol: 1.0e-8}
known:
  gpflow: {dtcvar_16: {why: 'Kuu jitter: GPy uses 1e-8, this framework 1e-6; the same convention difference as in sparse_properties, here seen at about 2e-5 relative in the gradient', fixed_by: kuu_jitter}, small_noise: {why: 'GPy adds 1e-8 to the noise variance in exact Gaussian inference (exact_gaussian_inference.py: variance+1e-8), so at noise 1e-3 it evaluates at a variance 1e-5 relative higher than the document states. Against a 60-digit evaluation, the other five frameworks agree to 1e-12 and GPy agrees to 1e-12 only when that 1e-8 is added to the noise. The deviation is a property of the GPy oracle, not of this framework', fixed_by: exact_jitter}}
  gpjax: {dtcvar_16: {why: 'Kuu jitter: GPy uses 1e-8, this framework 1e-6; the same convention difference as in sparse_properties, here seen at about 2e-5 relative in the gradient', fixed_by: kuu_jitter}, small_noise: {why: 'GPy adds 1e-8 to the noise variance in exact Gaussian inference (exact_gaussian_inference.py: variance+1e-8), so at noise 1e-3 it evaluates at a variance 1e-5 relative higher than the document states. Against a 60-digit evaluation, the other five frameworks agree to 1e-12 and GPy agrees to 1e-12 only when that 1e-8 is added to the noise. The deviation is a property of the GPy oracle, not of this framework', fixed_by: exact_jitter}}
