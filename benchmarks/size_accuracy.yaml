name: size_accuracy
kind: accuracy
description: >
  Agreement as the data set grows: errors that are invisible on five points accumulate over
  hundreds, in dense exact models and in sparse FITC and DTCVar models with fixed inducing points.
seed: 2
base:
  n: 500
  input_dim: 2
  noise: 0.1
  approximation: ftc
  kernel: {type: kern.matern52, variance: 1.0, lengthscale: 1.0}
cases:
  - {id: exact_500}
  - {id: fitc_1000, n: 1000, approximation: fitc, inducing: 30}
  - id: ard_d10_500
    input_dim: 10
    kernel: {type: kern.rbf, variance: 1.0, ARD: true, lengthscale: [0.5, 0.8, 1.2, 2.0, 3.0, 5.0, 8.0, 13.0, 25.0, 50.0]}
  - {id: dtcvar_1000, n: 1000, approximation: dtcvar, inducing: 30}
tolerance: {log_likelihood: 1.0e-4, mean: 1.0e-5, var: 1.0e-5}
known:
  gpflow: {dtcvar_1000: {why: "differs from the GPy reference by about 1e-2; same mechanism as sparse_properties, where it was traced to the Kuu jitter (1e-6 here, 1e-8 in GPy) against an independent numpy implementation", fixed_by: kuu_jitter}}
  gpjax: {dtcvar_1000: {why: "differs from the GPy reference by about 1e-2; same mechanism as sparse_properties, where it was traced to the Kuu jitter (1e-6 here, 1e-8 in GPy) against an independent numpy implementation", fixed_by: kuu_jitter}}
  gpmat: {dtcvar_1000: {why: "differs from the GPy reference by about 1e-2; same mechanism as sparse_properties, where it was traced to the Kuu jitter (1e-6 here, 1e-8 in GPy) against an independent numpy implementation", fixed_by: kuu_jitter}}
