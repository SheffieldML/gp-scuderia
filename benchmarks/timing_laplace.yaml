name: timing_laplace
kind: timing
description: >
  Wall-clock cost of Laplace inference with a Bernoulli (probit) likelihood as n grows.
  Answers: what does the Newton iteration cost over the exact Gaussian path in each framework?
  Accuracy tolerance is a sanity check only (Laplace modes differ slightly between frameworks).
seed: 13
base:
  n: 100
  input_dim: 2
  likelihood: bernoulli
  approximation: ftc
  kernel: {type: kern.rbf, variance: 1.5, lengthscale: 1.0}
grid:
  n: [100, 200, 400, 800, 1600]
tiers:
  pr: {n: [100, 400]}
timing: {repeats: 5, warmup: 1}
tolerance: {log_likelihood: 1.0, mean: 5.0e-2, var: 5.0e-2}
