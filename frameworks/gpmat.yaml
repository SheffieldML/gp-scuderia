name: gpmat
runners:
  - id: octave
    kind: octave
    script: octave/gpmat/runGpmat.m
    env: GPMAT
    versions_from_run: true
    fetch:    # first commit with the FITC log-likelihood fix
      git: https://github.com/SheffieldML/GPmat.git
      rev: fb229ee2
    apt: [octave]
ci:
  modes: [pinned]
capabilities:
  approximations: [ftc, dtc, dtcvar, fitc, pitc]
  kernels: [rbf, matern32, matern52, white, bias, linear, add, prod]
  likelihoods: [gaussian]
  inference: [exact]
  extras: [mean.constant, normalizer.center, normalizer.standardize]
operations: [gradient]      # d log-likelihood / d wire hyperparameter, CIP-0005
