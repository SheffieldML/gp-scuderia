# Portable type registry (schema_version 0.1 draft)
#
# Maps framework-neutral wire tags to toolbox-native identifiers.
# The wire tag is the contract; no framework is the reference.
# Portable tags happen to follow GPy dotted paths because that vocabulary
# is the most widely recognised, not because GPy semantics are normative.
#
# Framework keys: gpy, gpc, gpmat, gpytorch, gpflow, gpjax.
#   value `null`  -> no native equivalent; adapters must fail loudly.
#   `verified`    -> false until a golden round-trip exists in examples/.
#
# Verification levels (per entry):
#   api_checked: date on which class names and parameter names were read from
#     upstream source (GPyTorch main, GPflow develop, GPJax main). This checks
#     that the names exist; it does NOT check numerical agreement.
#   verified: true only once a golden round-trip reproduces log-likelihood and
#     predictions within tolerance. No entry is verified yet.
#
# Parameter conventions (wire names are natural, positive, untransformed):
#   variance      signal variance sigma^2
#   lengthscale   length scale l (scalar, or list when ARD)
# Each framework entry may give `params:` mapping wire name -> native
# attribute and a `transform` describing the conversion from wire to native.
# Transform tokens: identity | inverse (1/x) | sqrt | square | softplus_inv
# (native stored value is the inverse-softplus of the wire value).
schema_version: "0.1"

types:
  - portable: kern.rbf
    notes: >
      Squared-exponential. GPc stores inverseWidth (transform inverse of
      lengthscale^2 convention: confirm against CIP-0014 table). GPyTorch has
      no signal variance on RBFKernel; wrap in ScaleKernel. GPc splits ARD
      into a separate stream type (rbfard); the wire uses the ARD flag.
    gpy:
      class: GPy.kern.RBF
      params: {variance: variance, lengthscale: lengthscale}
    gpc:
      stream: rbf
      stream_ard: rbfard
      params: {variance: variance, lengthscale: {native: inverseWidth, transform: cip0014}}
    gpmat:
      kern: rbf
      params: {variance: variance, lengthscale: {native: inverseWidth, transform: cip0014}}
    gpytorch:
      class: gpytorch.kernels.ScaleKernel(gpytorch.kernels.RBFKernel)
      params: {variance: outputscale, lengthscale: base_kernel.lengthscale}
    gpflow:
      class: gpflow.kernels.SquaredExponential
      params: {variance: variance, lengthscale: lengthscales}
    gpjax:
      class: gpjax.kernels.RBF
      params: {variance: variance, lengthscale: lengthscale}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: kern.matern32
    gpy: {class: GPy.kern.Matern32}
    gpc: {stream: matern32, stream_ard: matern32ard}
    gpmat: {kern: matern32}
    gpytorch: {class: "gpytorch.kernels.ScaleKernel(gpytorch.kernels.MaternKernel(nu=1.5))"}
    gpflow: {class: gpflow.kernels.Matern32}
    gpjax: {class: gpjax.kernels.Matern32}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: kern.matern52
    gpy: {class: GPy.kern.Matern52}
    gpc: {stream: matern52, stream_ard: matern52ard}
    gpmat: {kern: matern52}
    gpytorch: {class: "gpytorch.kernels.ScaleKernel(gpytorch.kernels.MaternKernel(nu=2.5))"}
    gpflow: {class: gpflow.kernels.Matern52}
    gpjax: {class: gpjax.kernels.Matern52}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false
    verified_in: [gpy, gpc, gpmat]   # goldens fitc_matern52, ftc_prod_matern52

  - portable: kern.coregionalize
    notes: >
      B = W W' + diag(kappa), K_nm = B[i_n, i_m] with the output index read from
      the single active column. Used inside kern.prod (ICM) and kern.add of
      prods (LCM). GPmat, GPyTorch, GPflow and GPJax adapters reject it in 0.1.
    gpy: {class: GPy.kern.Coregionalize, params: {W: W, kappa: kappa}}
    gpc: {class: CCoregionalizeKern, params: {W: W, kappa: kappa}}
    gpmat: {unsupported: true}
    gpytorch: {unsupported: true}
    gpflow: {class: gpflow.kernels.Coregion}
    gpjax: {unsupported: true}
    verified: false
    verified_in: [gpy, gpc]   # goldens ftc_icm, ftc_lcm

  - portable: kern.white
    notes: >
      GPyTorch has no white kernel; its noise lives in the likelihood. Adapters
      must reject kern.white in a GPyTorch model rather than fold it silently
      into the likelihood.
    gpy: {class: GPy.kern.White}
    gpc: {stream: white}
    gpmat: {kern: white}
    gpytorch: null
    gpflow: {class: gpflow.kernels.White}
    gpjax: {class: gpjax.kernels.White}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: kern.bias
    notes: >
      GPflow Constant has `variance`; GPyTorch ConstantKernel has a positive
      `constant`; GPJax Constant has `constant`, an unconstrained Real, so the
      adapter must reject or clip non-positive values on import. GPyTorch
      documents ConstantKernel as the prior variance of a constant, matching
      GPy Bias semantics.
    gpy: {class: GPy.kern.Bias}
    gpc: {stream: bias}
    gpmat: {kern: bias}
    gpytorch: {class: gpytorch.kernels.ConstantKernel, params: {variance: constant}}
    gpflow: {class: gpflow.kernels.Constant, params: {variance: variance}}
    gpjax: {class: gpjax.kernels.Constant, params: {variance: constant}}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: kern.linear
    gpy: {class: GPy.kern.Linear}
    gpc: {stream: lin, stream_ard: linard}
    gpmat: {kern: lin}
    gpytorch: {class: gpytorch.kernels.LinearKernel}
    gpflow: {class: gpflow.kernels.Linear}
    gpjax: {class: gpjax.kernels.Linear}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: kern.add
    notes: "Children under parts[]; order significant for parameter ordering only."
    gpy: {class: GPy.kern.Add}
    gpc: {stream: cmpnd}
    gpmat: {kern: cmpnd}
    gpytorch: {class: gpytorch.kernels.AdditiveKernel}
    gpflow: {class: gpflow.kernels.Sum}
    gpjax: {class: gpjax.kernels.SumKernel}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: kern.prod
    notes: >
      Product over the same inputs. GPc `tensor` and GPmat `tensor` are products
      over the same inputs (confirmed by golden ftc_prod_matern52). kern.white
      inside a product is refused: it is an additive noise term.
    gpy: {class: GPy.kern.Prod}
    gpc: {stream: tensor}
    gpmat: {kern: tensor}
    gpytorch: {class: gpytorch.kernels.ProductKernel}
    gpflow: {class: gpflow.kernels.Product}
    gpjax: {class: gpjax.kernels.ProductKernel}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false
    verified_in: [gpy, gpc, gpmat]   # golden ftc_prod_matern52

  - portable: likelihoods.mixed_gaussian
    notes: >
      Per-output Gaussian noise variances for stacked multi-output data; the
      output index is data.X[:, output_index_column]. GPc realises it as an
      index-white kernel plus a frozen 1e-6 likelihood variance (variances on
      the wire are exact; the 1e-6 is subtracted on import and added on export).
    gpy: {class: GPy.likelihoods.MixedNoise}
    gpc: {class: CIndexWhiteKern}
    gpmat: {unsupported: true}
    gpytorch: {unsupported: true}
    gpflow: {unsupported: true}
    gpjax: {unsupported: true}
    verified: false
    verified_in: [gpy, gpc]

  - portable: likelihoods.gaussian
    notes: >
      Wire parameter is noise variance. GPJax parameterises by standard
      deviation (obs_stddev): transform sqrt. GPyTorch GaussianLikelihood
      noise is a variance but is stored through a positive constraint.
    gpy:
      class: GPy.likelihoods.Gaussian
      params: {variance: variance}
    gpc:
      stream: gaussian
      params: {variance: {native: beta, transform: inverse}}
    gpmat: {noise: gaussian}
    gpytorch:
      class: gpytorch.likelihoods.GaussianLikelihood
      params: {variance: noise}
    gpflow:
      class: gpflow.likelihoods.Gaussian
      params: {variance: variance}
    gpjax:
      class: gpjax.likelihoods.Gaussian
      params: {variance: {native: obs_stddev, transform: sqrt}}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: likelihoods.bernoulli
    notes: >
      Binary labels y in {0, 1} with p(y=1|f) = Phi(f) (link: probit). No
      variance. Needs `inference`. Predictive mean is P(y=1), var is p(1-p).
    gpy: {class: GPy.likelihoods.Bernoulli}
    gpc: {class: CGp, inference: laplace, noise: CProbitNoise}
    gpmat: {unsupported: true}
    gpytorch: {unsupported: true}
    gpflow: {unsupported: true}
    gpjax: {unsupported: true}
    verified: false
    verified_in: [gpy, gpc]   # golden laplace_bernoulli; independent numpy check in scripts/check_laplace_independent.py

  - portable: likelihoods.poisson
    notes: >
      Counts y in {0, 1, 2, ...} with rate exp(f) (link: log). No variance.
      Needs `inference`. Predictive mean is exp(mu + s2/2); var is
      mean + mean^2 (exp(s2) - 1).
    gpy: {class: GPy.likelihoods.Poisson}
    gpc: {class: CGp, inference: laplace, noise: CPoissonNoise}
    gpmat: {unsupported: true}
    gpytorch: {unsupported: true}
    gpflow: {unsupported: true}
    gpjax: {unsupported: true}
    verified: false
    verified_in: [gpy, gpc]   # golden laplace_poisson

  - portable: models.gp
    notes: >
      Full GP with a non-Gaussian likelihood and an `inference` tag (laplace).
      Reference values: log_likelihood is the Laplace log marginal likelihood
      (Rasmussen and Williams eq. 3.32); latent_mean and latent_var are the
      Laplace predictive moments of f; mean and var are the moments of y.
      GPy and GPc (CLaplaceInference, which mirrors GPy) realise Laplace
      inference. GPmat has no Laplace; GPflow and GPJax offer variational/MCMC alternatives, which are different
      approximations and must not be substituted silently).
    gpy: {class: GPy.core.GP, inference: GPy.inference.latent_function_inference.Laplace}
    gpc: {class: CGp, inference: laplace, noise: CProbitNoise or CPoissonNoise}
    gpmat: {unsupported: true}
    gpytorch: {unsupported: true}
    gpflow: {unsupported: true}
    gpjax: {unsupported: true}
    verified: false
    verified_in: [gpy, gpc]

  - portable: models.gp_regression
    gpy: {class: GPy.models.GPRegression}
    gpc: {type: gp, approximation: ftc}
    gpmat: {model: gp}
    gpytorch: {class: gpytorch.models.ExactGP}
    gpflow: {class: gpflow.models.GPR}
    gpjax:
      class: gpjax.gps.ConjugateModel
      construct: "gpjax.gps.Prior(mean_function, kernel) * gpjax.likelihoods.Gaussian(num_datapoints, obs_stddev)"
      notes: "API read from GPJax main (ConjugateModel, built by prior * likelihood). Earlier tagged releases used ConjugatePosterior; pin a version before writing the adapter."

    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: models.sparse_gp_regression
    notes: >
      Inference is selected by `approximation`, not by model class. Native
      support varies; see approximations: below. Unsupported combinations
      must raise. GPyTorch has no sparse-regression model class: sparse GP
      regression is an ExactGP whose covariance is an InducingPointKernel
      (Titsias bound via an added loss term). By default it also applies a
      diagonal correction to predictive variances (settings.sgpr_diagonal_correction),
      which is FITC-like at prediction time, so predictions need not match
      pure DTCVar; the adapter must record or disable this.
    gpy: {class: GPy.models.SparseGPRegression}
    gpc: {type: gp}
    gpmat: {model: gp}
    gpytorch:
      class: gpytorch.models.ExactGP
      kernel_wrapper: gpytorch.kernels.InducingPointKernel(base_kernel, inducing_points, likelihood)
    gpflow:
      class: gpflow.models.SGPR
      class_fitc: gpflow.models.GPRFITC
    gpjax: {class: gpjax.variational_families.CollapsedVariationalGaussian}
    api_checked: "2026-11-25"   # gpytorch/gpflow/gpjax names only
    verified: false

  - portable: mean.constant
    notes: >
      Prior mean on the original target scale; equivalent to fitting a zero-mean
      GP to y - c, so no Jacobian. GPc and GPmat map it onto bias (scale 1).
    gpy: {class: GPy.mappings.Constant, params: {value: C}}
    gpc: {native: bias}
    gpmat: {native: bias}
    gpytorch: {status: not-yet-checked}
    gpflow: {status: not-yet-checked}
    gpjax: {status: not-yet-checked}
    verified: false
    verified_in: [gpy, gpc, gpmat]   # golden dtcvar_mean_constant

  - portable: normalizer.center
    notes: >
      Fitted to y - mean. GPy has no centre-only normalizer: the adapter uses
      Standardize with std 1. GPc and GPmat map onto bias.
    gpy: {class: GPy.util.normalizer.Standardize, params: {mean: mean}}
    gpc: {native: bias}
    gpmat: {native: bias}
    gpytorch: {status: not-yet-checked}
    gpflow: {status: not-yet-checked}
    gpjax: {status: not-yet-checked}
    verified: false
    verified_in: [gpc]   # via gp export of a centred model

  - portable: normalizer.standardize
    notes: >
      Fitted to (y - mean) / std. Reported log likelihood includes -n log std,
      which GPy, GPc and GPmat do not add themselves, so each adapter adds it.
      The GPy adapter fixes mean and std from the wire instead of the data.
    gpy: {class: GPy.util.normalizer.Standardize, params: {mean: mean, std: std}}
    gpc: {native: "bias, scale"}
    gpmat: {native: "bias, scale"}
    gpytorch: {status: not-yet-checked}
    gpflow: {status: not-yet-checked}
    gpjax: {status: not-yet-checked}
    verified: false
    verified_in: [gpy, gpc, gpmat]   # golden ftc_standardize

# Which approximation tags each framework can realise for sparse regression.
# gpflow fitc: gpflow.models.GPRFITC (Snelson & Ghahramani). gpflow dtcvar:
# gpflow.models.SGPR (Titsias 2009). gpjax dtcvar: CollapsedVariationalGaussian
# (requires a Gaussian likelihood). gpytorch dtcvar: InducingPointKernel (see
# prediction caveat above). No class found for dtc or pitc outside GPy/GPc/GPmat.
# false means "no native class found on 2026-11-25", not "impossible".
approximations:
  ftc:    {gpy: true,  gpc: true,  gpmat: true,  gpytorch: true,  gpflow: true,  gpjax: true}
  dtc:    {gpy: true,  gpc: true,  gpmat: true,  gpytorch: false, gpflow: false, gpjax: false}
  dtcvar: {gpy: true,  gpc: true,  gpmat: true,  gpytorch: true,  gpflow: true,  gpjax: true}
  fitc:   {gpy: true,  gpc: true,  gpmat: true,  gpytorch: false, gpflow: true,  gpjax: false}
  pitc:   {gpy: true,  gpc: true,  gpmat: true,  gpytorch: false, gpflow: false, gpjax: false}

# Per-framework verification against the goldens (scripts/check_adapter.py).
# 'reproduces' lists goldens matched within tolerance; anything else is refused with an explicit error.
framework_verification:
  gpflow:
    reproduces: [ftc_rbf_white, ftc_prod_matern52, ftc_standardize, dtcvar_ard_data, dtcvar_mean_constant]
    refuses: [fitc_matern52, ftc_icm, ftc_lcm]
  gpytorch:
    reproduces: [ftc_prod_matern52, ftc_standardize]
    refuses: [ftc_rbf_white, dtcvar_ard_data, dtcvar_mean_constant, fitc_matern52, ftc_icm, ftc_lcm]
  gpjax:
    reproduces: [ftc_rbf_white, ftc_prod_matern52, ftc_standardize, dtcvar_ard_data, dtcvar_mean_constant]
    refuses: [fitc_matern52, ftc_icm, ftc_lcm]
